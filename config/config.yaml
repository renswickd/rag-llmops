app:
  name: rag-llmops
  environment: dev
  description: A document Q&A API powered by Retrieval-Augmented Generation.
  version: 0.1.0

logging:
  level: INFO
  log_dir: logs
  # file_enabled: true
  console_enabled: true
  file_name_prefix: app
  json: true

llm:
  groq:
    provider: groq
    model_name: openai/gpt-oss-20b
    temperature: 0
    max_output_tokens: 2048
    condense_question: true
    max_history_turns: 10

embedding_model:
  model_name: google/embeddinggemma-300m
  device: cpu
  normalize_embeddings: true

data:
  data_dir: data
  history_dir: data/history
  uploads_subdir: uploads
  allowed_extensions:
    - .pdf
    - .txt
    - .md

data_ingestion:
  chunk_size: 1000
  chunk_overlap: 150

retriever:
  supported_search_types:
    - similarity
    - mmr
    - similarity_score_threshold
  default_search_type: similarity
  default_top_k: 4
  default_score_threshold: 0.75
  default_fetch_k: 20
  default_lambda_mult: 0.5

api:
  host: "0.0.0.0"
  port: 8000
  debug: false
  index_dir: faiss_index

storage:
  backend: local   # Options: local | azure_blob
                   # Set to azure_blob in production (APP_ENVIRONMENT=production)
  blob_containers:
    uploads: uploads
    history: history
    registry: registry
    registry_blob_name: session_registry.json

rate_limiting:
  enabled: true   # set to false to disable during load testing
  chat_rpm: 10    # requests per minute per IP on POST /chat
  upload_rpm: 5   # requests per minute per IP on POST /documents/upload
