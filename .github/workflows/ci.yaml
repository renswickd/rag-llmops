name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # ───────────────────────────────────────────
  # Job 1 — Backend tests
  # Runs pytest on every push to every branch.
  # ───────────────────────────────────────────
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Install uv
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # uv sync installs all deps including [dependency-groups] dev (pytest).
      - name: Install dependencies
        run: uv sync --frozen

      # Run the full test suite with verbose output.
      - name: Run backend tests
        run: uv run pytest tests/ -v
  
  # ─────────────────────────────────────────────────────────────────────────
  # Job 2 — Frontend build check
  # Validates that the TypeScript compiles and Vite produces a dist/ bundle.
  # ─────────────────────────────────────────────────────────────────────────
  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # Cache npm packages between runs — avoids re-downloading on every push
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # Install ALL dependencies including devDependencies.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Type-check + bundle. 
      # Fails on TypeScript errors or missing imports.
      - name: Build frontend
        working-directory: frontend
        run: npm run build
  
  # ────────────────────────────────────────────────────────────────
  # Job 3 — Build Docker image and push to ACR
  # Only runs on the main branch AND only after both test jobs pass.
  # ────────────────────────────────────────────────────────────────
  build-push:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]

    # This condition is the gate: only push images from main.
    # Pull requests and feature branch pushes skip this job entirely.
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # AZURE_CREDENTIALS contains the full JSON; this action extracts
      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ fromJSON(secrets.AZURE_CREDENTIALS).clientId }}
          password: ${{ fromJSON(secrets.AZURE_CREDENTIALS).clientSecret }}

      # Build and push in one step using docker/build-push-action.
      # Two tags are applied:
      #   - sha-<7-char-commit-hash>  e.g. sha-a3f9c1b  — immutable, used for deploy + rollback
      #   - latest
      - name: Build and push image to ACR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/rag-llmops:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/rag-llmops:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
