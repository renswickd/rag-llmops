name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # ───────────────────────────────────────────
  # Job 1 — Backend tests
  # Runs pytest on every push to every branch.
  # ───────────────────────────────────────────
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Install uv
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # uv sync installs all deps including [dependency-groups] dev (pytest).
      - name: Install dependencies
        run: uv sync --frozen

      # Run the full test suite with verbose output.
      - name: Run backend tests
        run: uv run pytest tests/ -v
  
  # ─────────────────────────────────────────────────────────────────────────
  # Job 2 — Frontend build check
  # Validates that the TypeScript compiles and Vite produces a dist/ bundle.
  # ─────────────────────────────────────────────────────────────────────────
  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # Cache npm packages between runs — avoids re-downloading on every push
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # Install ALL dependencies including devDependencies.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Type-check + bundle. 
      # Fails on TypeScript errors or missing imports.
      - name: Build frontend
        working-directory: frontend
        run: npm run build
