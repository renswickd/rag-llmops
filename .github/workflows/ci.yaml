name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ───────────────────────────────────────────
  # Job 1 — Backend tests
  # Runs pytest on every push to every branch.
  # ───────────────────────────────────────────
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # uv sync installs all deps including [dependency-groups] dev (pytest).
      - name: Install dependencies
        run: uv sync --frozen

      # Run the full test suite with verbose output.
      - name: Run backend tests
        run: uv run pytest tests/ -v

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2 — Frontend build check
  # Validates that the TypeScript compiles and Vite produces a dist/ bundle.
  # ─────────────────────────────────────────────────────────────────────────
  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          # Cache npm packages between runs — avoids re-downloading on every push
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # Install ALL dependencies including devDependencies.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Type-check + bundle.
      # Fails on TypeScript errors or missing imports.
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # ────────────────────────────────────────────────────────────────
  # Job 3 — Build Docker image and push to ACR
  # Only runs on the main branch AND only after both test jobs pass.
  # ────────────────────────────────────────────────────────────────
  build-push:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]

    # This condition is the gate: only push images from main.
    # Pull requests and feature branch pushes skip this job entirely.
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ fromJSON(secrets.AZURE_CREDENTIALS).clientId }}
          password: ${{ fromJSON(secrets.AZURE_CREDENTIALS).clientSecret }}

      # Build and push in one step using docker/build-push-action.
      # Two tags are applied:
      #   - sha-<commit-hash>  — immutable, used for deploy + rollback
      #   - latest             — always points to the most recent main build
      - name: Build and push image to ACR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Build for both amd64 (Azure/Linux servers) and arm64 (Apple Silicon Macs).
          # Docker Desktop on Mac will pull the arm64 variant automatically.
          # In production Azure runs amd64 — both variants share the same image tag.
          platforms: linux/amd64,linux/arm64
          # provenance=false prevents buildx from attaching SLSA attestation manifests.
          provenance: false
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/rag-llmops:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/rag-llmops:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            HF_TOKEN=${{ secrets.HF_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────────
  # Job 4 — Deploy to Azure Container Apps
  # Runs only after build-push succeeds AND only on the main branch.
  # Updates the running Container App to the exact image SHA just pushed.
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: [build-push]

    # Same gate as build-push — skip on feature branches and PRs.
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy new image to ACA
        run: |
          az containerapp update \
            --name rag-llmops-backend \
            --resource-group rg-rag-llmops \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/rag-llmops:sha-${{ github.sha }}