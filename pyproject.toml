[project]
name = "rag-llmops"
version = "0.1.0"
description = "End-to-end implementation of RAG with LLMOps best practice"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "azure-storage-blob>=12.25.0",
    "faiss-cpu>=1.13.2",
    "fastapi>=0.135.1",
    "jsonpatch==1.33",
    "langchain>=1.2.13",
    "langchain-community>=0.4.1",
    "langchain-core>=1.2.20",
    "langchain-groq>=1.1.2",
    "langchain-huggingface>=1.2.1",
    "langchain-openai>=1.1.11",
    "langchain-text-splitters>=1.1.1",
    "langgraph>=1.1.3",
    "pymupdf>=1.27.2.2",
    "pypdf>=6.9.2",
    "pytest>=9.0.2",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.24",
    "sentence-transformers>=5.3.0",
    "streamlit>=1.55.0",
    "structlog>=25.5.0",
    "uvicorn>=0.42.0",
]

# Dev-only tools — excluded from the production Docker image via --no-group dev
[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "streamlit>=1.55.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "conversation*", "ingestion*", "core*", "utils*", "scripts*"]
exclude = ["tests*"]

# ─── PyTorch index override ────────────────────────────────────────────────────
# Force CPU-only torch on Linux (i.e., inside the Docker container).
# Without this, uv resolves torch from PyPI which ships the full CUDA variant on
# Linux — pulling in cuda-toolkit, cuda-bindings, nvrtc, etc. (~2 GB extra).
# On macOS the default PyPI wheel is already CPU/MPS — no override needed there.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
